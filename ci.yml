name: Roti Counter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: gcc -Wall -Wextra -o roti_counter roti_counter.c -pthread

      - name: Run
        run: timeout 60 ./roti_counter | tee output.txt

      - name: Verify
        run: |
          grep -q "All rotis served" output.txt
          test "$(grep -c 'placed roti' output.txt)" -eq 12
          test "$(grep -c 'took roti' output.txt)" -eq 12

      - uses: actions/upload-artifact@v4
        with:
          name: roti-output
          path: output.txt
